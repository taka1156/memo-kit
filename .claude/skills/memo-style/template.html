<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイトル</title>
<meta name="description" content="何がわかるページかを 1 文で">
<meta name="memo:tags" content="タグ1, タグ2">
<meta name="memo:date" content="YYYY-MM-DD">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1c2230;
  --fg-2: #5a6376;
  --line: #dde1e8;
  --accent: #0077b6; /* 実際の色は memo.config.json の branding で決まり、memo:head が上書きする */
  --chip: #eceff4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0e14;
    --surface: #111823;
    --fg: #cdd9e5;
    --fg-2: #7d8b9d;
    --line: #1e2d3d;
    --accent: #00d4ff;
    --chip: #18222f;
  }
}
/* 共通部品（ざっくり言うと・よくある誤解・番号付きの手順・表やリストの中のリンク）と
   解説用の色（--c-ok・--c-ng・--c-warn・--c-hl）は assets/memo-parts.css にある（build・preview が読み込む）。
   ここで書き直さない。ページ独自の色分けが要るときは、意味ごとの --c-名前 を :root に足し、凡例やラベルを付ける。
   アクセント色（--accent）は h1・h2 の左線・段落のリンク・ボタンやタブの操作状態にだけ使う */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.7;
  padding: 40px 16px 72px;
}
.wrap { max-width: 880px; margin: 0 auto; }
h1 {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: clamp(1.2rem, 4vw, 1.6rem);
  color: var(--accent);
  letter-spacing: 0.06em;
}
.subtitle { color: var(--fg-2); font-size: 0.85rem; margin: 4px 0 28px; }
h2 {
  font-size: 1.1rem;
  margin: 36px 0 12px;
  padding-left: 10px;
  border-left: 3px solid var(--accent);
}
p { margin: 8px 0; }
code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.85em;
  background: var(--chip);
  padding: 1px 5px;
  border-radius: 4px;
}
pre {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.8rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  overflow-x: auto;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 18px;
}

/* タブ */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tab {
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--fg-2);
  border-radius: 999px;
  padding: 5px 14px;
  font: 600 0.78rem 'JetBrains Mono', ui-monospace, monospace;
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.panel[hidden] { display: none; }

footer#memo-backlink {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  text-align: center;
}
footer#memo-backlink a {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--chip);
  color: var(--fg-2);
  font: 600 12px/1.4 'JetBrains Mono', ui-monospace, monospace;
  letter-spacing: .08em;
  text-decoration: none;
}
footer#memo-backlink a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>タイトル</h1>
  <p class="subtitle">1 行のサブタイトル</p>

  <div class="card summary">
    <strong>ざっくり言うと</strong>
    <ul>
      <li>要点 1</li>
      <li>要点 2</li>
      <li>要点 3</li>
    </ul>
  </div>

  <h2 id="section">セクション</h2>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-panel="p1">概要</button>
    <button class="tab" role="tab" aria-selected="false" data-panel="p2">詳細</button>
  </div>
  <div class="panel card" id="p1">ここに図解や説明。</div>
  <div class="panel card" id="p2" hidden>ここに詳細。</div>

  <h2 id="steps">手順</h2>
  <ol class="steps">
    <li><b>手順の見出し</b>説明。番号の丸は標準でグレー。意味があるときだけ li に class="is-ng" などを付ける</li>
    <li class="is-ng"><b>手順の見出し</b>説明（例: 攻撃の手順だけ赤）</li>
  </ol>

  <!-- よくある誤解（必要なときだけ。使わないなら見出しごと消す）。✗・✓・開閉マークは CSS で付くので本文に書かない -->
  <h2 id="myths">よくある誤解</h2>
  <details class="myth"><summary>誤解の文（「」で囲まない）</summary><p>正しい説明</p></details>

  <footer id="memo-backlink"><a href="index.html">&larr; 一覧に戻る</a></footer>
</div>

<script>
document.querySelectorAll('.tabs').forEach(group => {
  group.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    group.querySelectorAll('.tab').forEach(t => {
      const on = t === tab;
      t.setAttribute('aria-selected', String(on));
      document.getElementById(t.dataset.panel).hidden = !on;
    });
  });
});
</script>

<!-- 確認クイズ（問題データだけ書く。表示は memo.py がページ末尾に自動で入れる）
     作り方は memo-style の「確認クイズ」を参照。ref は本文の見出しなどの id -->
<script type="application/json" id="memo-quiz">
[
  {
    "q": "〇〇したい場面で、まず選ぶべきものは？",
    "choices": ["正解の選択肢", "よくある誤解の選択肢", "別の場面向けの選択肢"],
    "answer": 0,
    "explain": "なぜそれを選ぶのかを 1〜2 文で。",
    "ref": "#section"
  }
]
</script>
</body>
</html>
