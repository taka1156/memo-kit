name: Deploy MEMO

# 原本（src/・scripts/・memo.config.json）が push されたら、build で公開用のサイト一式を dist/ に書き出し、
# GitHub Pages の公式 Action（upload-pages-artifact・deploy-pages）でそのまま公開する。
# リポジトリには何も書き込まない（原本のブランチにも、ほかのブランチにもコミットしない）。
# 使う権限は 2 つのジョブで分ける: build は読み取りだけ、deploy は Pages への公開（pages: write・id-token: write）だけ。
# どちらもリポジトリへの書き込み権限（contents: write）を持たないので、外のパッケージが乗っ取られても原本は書き換えられない。
# 公開元の設定: Settings → Pages → Source を「GitHub Actions」にする。
# GitHub の画面から HTML を直接アップロードしても、ここで一覧に載って公開される。
# 動くのはデフォルトブランチへの push だけ（ブランチ名は書かない。フォークしても main / master どちらでも動く）。
on:
  push:
    paths:
      - "src/**" # メモ・トップ・共通ファイル・画像・CNAME
      - "scripts/**" # memo.py と memolib/
      - "memo.config.json" # サイト名・リポジトリ・ブランチ・アクセント色・ロードマップ・クイズ
      - "package.json" # 本文検索の索引を作る Pagefind の版
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call: # Set accent color が設定を変えたあとに呼ぶ（Actions からの push では push のワークフローが動かないため）

permissions:
  contents: read

# 続けて push されたときに 2 つのデプロイが同時に走らないよう、1 本ずつ順番に動かす（途中で止めない）
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push なら push されたコミット、それ以外（手動・Set accent color から）はデフォルトブランチの最新
          ref: ${{ github.event_name == 'push' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0 # memo:date がないメモの日付を git 履歴から推定するため
          persist-credentials: false # 認証情報を .git/config に残さない（読み取りだけのトークンでも、後のステップに渡さない）

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # memo.config.json の branch（スキルの push 先・入口スキルの clone 先）がデフォルトブランチと違うと、
      # スキルが push しても公開されなくなる。ずれていたら止めて知らせる
      - name: Check branch setting
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="$(python3 scripts/memo.py config branch)"
          if [ "$branch" != "$DEFAULT_BRANCH" ]; then
            echo "::error title=branch::memo.config.json の branch（${branch}）がデフォルトブランチ（${DEFAULT_BRANCH}）と違います。branch を ${DEFAULT_BRANCH} にしてください"
            exit 1
          fi

      # テストに落ちたら公開しない（壊れた memo.py で公開中のサイトを上書きしないため）。
      # JS のテスト（npm）はここでは動かさない（test.yml が流す）。
      # 本物のメモの検査（全メモの lint など）は飛ばす。メモの指摘は下の lint の注釈と build --strict に任せる
      - name: Test
        env:
          MEMO_SKIP_REPO_TESTS: "1"
        run: python3 -B -m unittest discover -s tests

      # lint の指摘は公開を止めない（GitHub の画面から上げた HTML も一覧に載せるため）。指摘があれば注釈で目立たせる
      - name: Lint memos (report only)
        run: |
          if ! python3 scripts/memo.py lint --all; then
            echo "::warning title=lint::要対応の指摘があります（公開は続けます）。上のログを見て直してください"
          fi

      # --strict: クイズの崩れや、公開しないファイル（src/ の下書き・.env など）があれば止める
      - name: Build
        run: python3 scripts/memo.py build --strict

      # 一覧の本文検索の索引（dist/pagefind/）。外のパッケージはこれだけで、次の対策をしている:
      # 版と中身は package-lock.json で固定（npm ci が integrity を照合）・インストール時のスクリプトは動かさない（--ignore-scripts）・
      # 入れるのは dependencies の pagefind だけ（--omit=dev）・このジョブは読み取りの権限しか持たない・
      # 新しい版は公開から 3 日たってから Renovate が PR を作る（renovate.json）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Search index
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm run search-index

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # build が作った dist/ を Pages に公開する。外のパッケージも原本のコードも動かさない
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
