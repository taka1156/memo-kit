name: Test memo.py

# scripts/（memo.py・memolib）や仕組みのページの JS、テストを変えたら、テストを流す（Python と JS の両方）。
# テストはリポジトリを一時フォルダにコピーして動かすので、リポジトリ自体は書き換えない。
# ブランチ名は書かない（どのブランチへの push でも流す）。
on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "src/assets/memo-quiz.*"
      - "src/assets/memo-site.js"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.mjs"
      - "src/index.html"
      - "src/quiz.html"
      - "src/settings.html"
      - "src/roadmap.html"
      - "memo.config.json"
      - ".claude/skills/memo-style/template.html"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "src/assets/memo-quiz.*"
      - "src/assets/memo-site.js"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.mjs"
      - "src/index.html"
      - "src/quiz.html"
      - "src/settings.html"
      - "src/roadmap.html"
      - "memo.config.json"
      - ".claude/skills/memo-style/template.html"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v

      # 仕組みのページの JS（src/assets/memo-site.js・memo-quiz.js）のテスト。memo.py 自体は Node に依存しない
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: JS tests
        run: |
          npm ci --no-audit --no-fund
          npm test
