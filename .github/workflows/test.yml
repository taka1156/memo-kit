name: Test memo.py

# scripts/（memo.py・memolib）やテストを変えたら、テストを流す。
# テストはリポジトリを一時フォルダにコピーして動かすので、リポジトリ自体は書き換えない。
# ブランチ名は書かない（どのブランチへの push でも流す）。
on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "src/assets/memo-quiz.*"
      - "src/index.html"
      - "src/quiz.html"
      - "src/settings.html"
      - "src/roadmap.html"
      - "memo.config.json"
      - ".claude/skills/memo-style/template.html"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "src/assets/memo-quiz.*"
      - "src/index.html"
      - "src/quiz.html"
      - "src/settings.html"
      - "src/roadmap.html"
      - "memo.config.json"
      - ".claude/skills/memo-style/template.html"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
