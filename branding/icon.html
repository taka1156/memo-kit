<!doctype html><!-- アイコン（1024x1024）の元。__VARS・__CLS・__HOLES・__MARK は render.py が差し込む -->
<meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden}
body{background:var(--desk);position:relative;font-family:'DejaVu Sans Mono','Noto Sans CJK JP',monospace}
body.t{background:transparent}
.paper{position:absolute;left:150px;top:130px;width:700px;height:780px;background:var(--paper);border-radius:28px;
 transform:rotate(-4deg);box-shadow:0 24px 50px var(--shadow);overflow:hidden;
 background-image:repeating-linear-gradient(transparent 0 104px,var(--rule) 104px 112px);background-position:0 40px}
.paper:before{content:"";position:absolute;left:150px;top:0;bottom:0;width:8px;background:var(--margin);opacity:.55}
.holes{position:absolute;left:44px;top:90px;bottom:90px;display:flex;flex-direction:column;justify-content:space-between}
.holes i{display:block;width:56px;height:56px;border-radius:50%;background:var(--desk);box-shadow:inset 0 4px 6px var(--shadow)}
body.t .holes i{background:var(--holebg)}
.m{position:absolute;left:150px;right:150px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:var(--msize);line-height:1;color:var(--ink);white-space:nowrap}
.pen{position:absolute;right:120px;top:300px;transform:rotate(28deg)}
.small .paper{left:56px;top:56px;width:912px;height:912px;border-radius:90px;background-image:none;transform:rotate(-4deg)}
.small .paper:before{display:none}
.small .holes{left:50px;top:170px;bottom:170px}.small .holes i{width:120px;height:120px}
.small .m{left:120px;right:0}
.small .pen{display:none}
</style>
<body class="__CLS" style="__VARS;--msize:__MSIZE"><div class=paper><div class=holes>__HOLES</div><div class=m>__MARK</div></div>
<svg class=pen width="96" height="560" viewBox="0 0 70 560"><defs><linearGradient id=g x1=0 x2=1><stop offset=0 stop-color="var(--pen)"/><stop offset=.45 stop-color="var(--pen-hi)"/><stop offset=1 stop-color="var(--pen)"/></linearGradient></defs>
<rect x=14 y=20 width=42 height=380 rx=21 fill="url(#g)"/><rect x=14 y=330 width=42 height=10 fill="var(--pen-ring)"/>
<rect x=50 y=40 width=10 height=170 rx=5 fill="var(--pen-ring)"/><path d="M14 395 L56 395 L46 470 L24 470Z" fill="var(--pen-grip)"/>
<path d="M24 470 L46 470 L35 520Z" fill="var(--pen-ring)"/></svg></body>
