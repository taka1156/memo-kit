<!-- OGP 画像（1200x630）の元。__VARS・__TITLE・__TAGLINE・__URL は render.py が memo.config.json から差し込む -->
<meta charset=utf-8><link rel=stylesheet href=leaf.css><body style="__VARS"><div class=paper><div class=holes><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class=body>
<div class="mono title fit" data-max=128 data-min=48>__TITLE</div>
<div class="jp tagline">__TAGLINE</div>
<div class="mono url fit" data-max=24 data-min=14>__URL</div></div></div><svg class=pen width="70" height="560" viewBox="0 0 70 560"><defs><linearGradient id=g x1=0 x2=1><stop offset=0 stop-color="var(--pen)"/><stop offset=.45 stop-color="var(--pen-hi)"/><stop offset=1 stop-color="var(--pen)"/></linearGradient></defs>
<rect x=14 y=20 width=42 height=380 rx=21 fill="url(#g)"/><rect x=14 y=330 width=42 height=10 fill="var(--pen-ring)"/>
<rect x=50 y=40 width=10 height=170 rx=5 fill="var(--pen-ring)"/><path d="M14 395 L56 395 L46 470 L24 470Z" fill="var(--pen-grip)"/>
<path d="M24 470 L46 470 L35 520Z" fill="var(--pen-ring)"/><circle cx=35 cy=518 r=3 fill="var(--pen)"/></svg>
<script>
// 長いサイト名・URL は 1 行に収まるまで文字を小さくする（それでも長ければ末尾を … で切る）
for (const el of document.querySelectorAll('.fit')) {
  let size = +el.dataset.max;
  el.style.fontSize = size + 'px';
  while (el.scrollWidth > el.clientWidth && size > +el.dataset.min) el.style.fontSize = --size + 'px';
}
// 説明文は 2 行に収まるまで小さくする（それでも長ければ 2 行目の末尾を … で切る）
const t = document.querySelector('.tagline');
for (let size = 36; t.scrollHeight > t.clientHeight + 1 && size > 26; ) t.style.fontSize = --size + 'px';
</script></body>
