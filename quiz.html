<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-memo-site="{site_name} クイズ">MemoKit クイズ</title>
<meta name="description" content="MemoKit の確認クイズから、ランダムやカテゴリ別に 10 問ずつ解けるページ" data-memo-site-content="{site_name} の確認クイズから、ランダムやカテゴリ別に 10 問ずつ解けるページ">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1c2230;
  --fg-2: #5a6376;
  --line: #dde1e8;
  --accent: #0077b6;
  --chip: #eceff4;
  --ok: #1a7f37;
  --ng: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0e14;
    --surface: #111823;
    --fg: #cdd9e5;
    --fg-2: #7d8b9d;
    --line: #1e2d3d;
    --accent: #00d4ff;
    --chip: #18222f;
    --ok: #3fb950;
    --ng: #f85149;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.7;
  min-height: 100vh;
  padding: 48px 16px 64px;
}
.wrap { max-width: 720px; margin: 0 auto; }
header { margin-bottom: 24px; }
.back { font: 600 0.75rem 'JetBrains Mono', monospace; color: var(--fg-2); text-decoration: none; }
.back:hover { color: var(--accent); }
h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.6rem;
  letter-spacing: 0.12em;
  color: var(--accent);
  margin-top: 8px;
}
.lead { color: var(--fg-2); font-size: 0.85rem; margin-top: 4px; }
[hidden] { display: none !important; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 14px;
}
.panel h2 { font-size: 1rem; margin-bottom: 4px; }
.panel .note { color: var(--fg-2); font-size: 0.8rem; margin-bottom: 14px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--fg);
  border-radius: 999px;
  padding: 8px 18px;
  font: 700 0.85rem 'Noto Sans JP', system-ui, sans-serif;
  cursor: pointer;
  text-decoration: none;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.primary:hover:not(:disabled) { color: var(--bg); filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--fg);
  border-radius: 999px;
  padding: 6px 13px;
  font: 600 0.78rem 'JetBrains Mono', monospace;
  cursor: pointer;
}
.tag small { color: var(--fg-2); font-weight: 500; margin-left: 4px; }
.tag:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.tag:disabled { opacity: .4; cursor: default; }

/* 出題中 */
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font: 700 0.8rem 'JetBrains Mono', monospace; color: var(--fg-2); }
.bar { flex: 1; height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.from { font: 0.72rem 'JetBrains Mono', monospace; color: var(--fg-2); }
.question { font-weight: 700; font-size: 1.02rem; margin: 4px 0 14px; line-height: 1.6; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  text-align: left;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--chip);
  color: var(--fg);
  font: inherit; font-size: 0.92rem; line-height: 1.5;
  cursor: pointer;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; opacity: .6; }
.choice.ok { opacity: 1; border-color: var(--ok); box-shadow: inset 3px 0 0 var(--ok); }
.choice.ng { opacity: 1; border-color: var(--ng); box-shadow: inset 3px 0 0 var(--ng); }
.feedback { margin-top: 12px; font-size: 0.86rem; color: var(--fg-2); line-height: 1.7; }
b.ok { color: var(--ok); }
b.ng { color: var(--ng); }
.ref { color: var(--accent); font-weight: 700; text-decoration: none; white-space: nowrap; }
.ref:hover { text-decoration: underline; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.quit { margin-left: auto; background: none; border: 0; color: var(--fg-2); font: 600 0.75rem 'JetBrains Mono', monospace; cursor: pointer; }
.quit:hover { color: var(--accent); }

/* 結果 */
.score { text-align: center; padding: 8px 0 16px; }
.score .num { font: 700 2.4rem/1.1 'JetBrains Mono', monospace; color: var(--accent); }
.score .num small { font-size: 1rem; color: var(--fg-2); }
.score .msg { color: var(--fg-2); font-size: 0.85rem; margin-top: 6px; }
.review { list-style: none; display: flex; flex-direction: column; }
.review li { padding: 12px 0; border-top: 1px solid var(--line); font-size: 0.86rem; }
.review .rq { font-weight: 700; }
.review .ra { color: var(--fg-2); }
.review .rs { font: 0.7rem 'JetBrains Mono', monospace; color: var(--fg-2); margin-top: 2px; }
.empty { color: var(--fg-2); font-size: 0.85rem; }
footer { margin-top: 40px; font-size: 0.75rem; color: var(--fg-2); text-align: center; }
footer a { color: var(--accent); }
</style>
<!-- memo:head（scripts/memo.py が自動生成。手で編集しない） -->
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="MemoKit">
<meta property="og:type" content="article">
<meta property="og:site_name" content="MemoKit">
<meta property="og:title" content="MemoKit クイズ">
<meta property="og:description" content="MemoKit の確認クイズから、ランダムやカテゴリ別に 10 問ずつ解けるページ">
<meta property="og:url" content="https://repo.github.io/sample/quiz.html">
<meta property="og:image" content="https://repo.github.io/sample/assets/og.png?v=258752a2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style id="memo-accent">html:root{--accent:#0077b6}@media (prefers-color-scheme: dark){html:root{--accent:#00d4ff}}</style>
<!-- /memo:head -->
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">&larr; 一覧に戻る</a>
    <h1>QUIZ</h1>
    <p class="lead">各メモの確認クイズから 10 問ずつ出題します</p>
  </header>

  <!-- 条件を選ぶ -->
  <section id="setup">
    <div class="panel">
      <h2>🎲 ランダム 10 問</h2>
      <p class="note" id="all-note"></p>
      <button class="btn primary" id="start-random" type="button">はじめる</button>
    </div>
    <div class="panel">
      <h2>🏷 カテゴリを選んで 10 問</h2>
      <p class="note">数字はそのカテゴリの問題数。10 問未満なら全問を出します</p>
      <div class="tags" id="tag-list"></div>
    </div>
    <p class="empty" id="no-quiz" hidden>まだクイズがありません。各メモにクイズを追加すると、ここで解けるようになります。</p>
  </section>

  <!-- 出題中 -->
  <section id="play" hidden>
    <div class="panel">
      <div class="progress"><span id="count"></span><span class="bar"><i id="bar"></i></span><span id="cond"></span></div>
      <p class="from" id="from"></p>
      <p class="question" id="question"></p>
      <div class="choices" id="choices"></div>
      <p class="feedback" id="feedback" hidden></p>
      <div class="actions">
        <button class="btn primary" id="next" type="button" hidden>次の問題 →</button>
        <button class="quit" id="quit" type="button">やめる</button>
      </div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" hidden>
    <div class="panel">
      <div class="score">
        <div class="num" id="score"></div>
        <p class="msg" id="score-msg"></p>
      </div>
      <ol class="review" id="review"></ol>
      <div class="actions">
        <button class="btn primary" id="retry-wrong" type="button">間違えた問題だけもう一度</button>
        <button class="btn" id="retry" type="button">同じ条件でもう一度</button>
        <button class="btn" id="reset" type="button">条件を選び直す</button>
      </div>
    </div>
  </section>

  <footer><a href="index.html" data-memo-site="{site_name} 一覧">MemoKit 一覧</a></footer>
</div>

<script>
// 問題は各メモの確認クイズから集めた quizzes.json、タグは memos.json から読み込む（memo.py build が生成。memo-detail.md 参照）
// memo.py preview で作ったプレビュー用のコピーでは、埋め込まれた window.MEMO_DATA を使う
const MEMO_DATA = window.MEMO_DATA || null;
async function loadJSON(name) {
  if (MEMO_DATA && MEMO_DATA[name]) return MEMO_DATA[name];
  const res = await fetch(name, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
  return res.json();
}
let MEMOS = [];
let QUIZZES = [];
let tagsOf = {};

const COUNT = 10;
const $ = id => document.getElementById(id);
const shuffle = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const show = name => ['setup', 'play', 'result'].forEach(s => { $(s).hidden = s !== name; });

let cond = null;   // { tag: null | 'JavaScript' }
let set = [];      // 出題する問題
let picks = [];    // 選んだ選択肢の番号
let pos = 0;

// 本文の該当箇所へのリンク（別タブで開き、クイズの進み具合を残す）
function refLink(q, label) {
  const a = document.createElement('a');
  a.className = 'ref';
  a.href = q.file + (q.ref || '');
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = label;
  return a;
}

// ---- 条件選択
function setup() {
  cond = null;
  if (!QUIZZES.length) {
    $('no-quiz').hidden = false;
    document.querySelectorAll('#setup .panel').forEach(p => { p.hidden = true; });
    show('setup');
    return;
  }
  $('all-note').textContent = `全 ${QUIZZES.length} 問（${new Set(QUIZZES.map(q => q.file)).size} ページ）から出題`;
  const counts = {};
  for (const q of QUIZZES) for (const t of tagsOf[q.file] || []) counts[t] = (counts[t] || 0) + 1;
  const box = $('tag-list');
  box.textContent = '';
  for (const t of Object.keys(counts).sort()) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tag';
    b.textContent = t;
    const n = document.createElement('small');
    n.textContent = counts[t];
    b.appendChild(n);
    b.onclick = () => start({ tag: t });
    box.appendChild(b);
  }
  show('setup');
}

// ---- 出題
function start(c, questions) {
  cond = c;
  const pool = c.tag ? QUIZZES.filter(q => (tagsOf[q.file] || []).includes(c.tag)) : QUIZZES;
  set = questions || shuffle(pool).slice(0, COUNT);
  if (!set.length) return setup();
  picks = set.map(() => null);
  pos = 0;
  const url = new URL(location.href);
  url.search = c.tag ? '?tag=' + encodeURIComponent(c.tag) : '?mode=random';
  history.replaceState(null, '', url);
  $('cond').textContent = c.tag ? c.tag : 'ランダム';
  show('play');
  ask();
}

function ask() {
  const q = set[pos];
  $('count').textContent = `${pos + 1} / ${set.length}`;
  $('bar').style.width = (pos / set.length * 100) + '%';
  $('from').textContent = q.title;
  $('question').textContent = q.q;
  $('feedback').hidden = true;
  $('next').hidden = true;
  const box = $('choices');
  box.textContent = '';
  // 選択肢は毎回シャッフル（正解の位置で覚えないように）
  for (const k of shuffle(q.choices.map((_, i) => i))) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice';
    b.textContent = q.choices[k];
    b.dataset.k = k;
    b.onclick = () => answer(k);
    box.appendChild(b);
  }
  window.scrollTo({ top: 0 });
}

function answer(k) {
  const q = set[pos];
  const ok = k === q.answer;
  picks[pos] = k;
  for (const b of $('choices').children) {
    b.disabled = true;
    if (+b.dataset.k === q.answer) b.classList.add('ok');
    else if (+b.dataset.k === k) b.classList.add('ng');
  }
  const fb = $('feedback');
  fb.textContent = '';
  const v = document.createElement('b');
  v.className = ok ? 'ok' : 'ng';
  v.textContent = ok ? '⭕ 正解' : '❌ 不正解';
  fb.append(v, (ok ? ' ' : `（正解: ${q.choices[q.answer]}） `) + (q.explain || ''));
  if (!ok) fb.append(' ', refLink(q, '本文で確認する ↗'));
  fb.hidden = false;
  $('bar').style.width = ((pos + 1) / set.length * 100) + '%';
  const next = $('next');
  next.textContent = pos + 1 < set.length ? '次の問題 →' : '結果を見る →';
  next.hidden = false;
  next.focus({ preventScroll: true });
}

$('next').onclick = () => {
  if (++pos < set.length) ask();
  else result();
};
$('quit').onclick = () => {
  if (picks.some(p => p != null) && !confirm('途中でやめますか？')) return;
  history.replaceState(null, '', location.pathname);
  setup();
};

// ---- 結果
function result() {
  const ok = set.filter((q, i) => picks[i] === q.answer).length;
  const s = $('score');
  s.textContent = ok;
  const total = document.createElement('small');
  total.textContent = ` / ${set.length}`;
  s.appendChild(total);
  $('score-msg').textContent = ok === set.length
    ? '全問正解！'
    : `${cond.tag || 'ランダム'}・正答率 ${Math.round(ok / set.length * 100)}%　間違えた問題は本文で確認できます`;
  const list = $('review');
  list.textContent = '';
  set.forEach((q, i) => {
    const good = picks[i] === q.answer;
    const li = document.createElement('li');
    const head = document.createElement('div');
    head.className = 'rq';
    const mark = document.createElement('b');
    mark.className = good ? 'ok' : 'ng';
    mark.textContent = good ? '⭕' : '❌';
    head.append(mark, ` Q${i + 1}. ${q.q}`);
    const ans = document.createElement('div');
    ans.className = 'ra';
    ans.textContent = '正解: ' + q.choices[q.answer] + (good ? '' : ' ／ あなたの答え: ' + q.choices[picks[i]]);
    const src = document.createElement('div');
    src.className = 'rs';
    src.textContent = q.title + '　';
    src.appendChild(refLink(q, good ? 'メモを開く ↗' : '本文で確認する ↗'));
    li.append(head, ans);
    if (!good && q.explain) {
      const ex = document.createElement('div');
      ex.className = 'ra';
      ex.textContent = q.explain;
      li.appendChild(ex);
    }
    li.appendChild(src);
    list.appendChild(li);
  });
  const wrong = set.filter((q, i) => picks[i] !== q.answer);
  $('retry-wrong').hidden = !wrong.length;
  $('retry-wrong').onclick = () => start(cond, shuffle(wrong));
  show('result');
  window.scrollTo({ top: 0 });
}
$('retry').onclick = () => start(cond);
$('reset').onclick = () => { history.replaceState(null, '', location.pathname); setup(); };
$('start-random').onclick = () => start({ tag: null });

// ---- 読み込んではじめる。URL から直接はじめることもできる（quiz.html?tag=JavaScript / quiz.html?mode=random）
(async () => {
  try {
    [MEMOS, QUIZZES] = await Promise.all([loadJSON('memos.json'), loadJSON('quizzes.json')]);
  } catch (e) {
    $('no-quiz').textContent = '問題を読み込めませんでした。ファイルを直接開いた場合や会話内のプレビューでは表示されません（memo.py preview quiz で埋め込んだ版を作れます）。';
    MEMOS = [];
    QUIZZES = [];
  }
  tagsOf = Object.fromEntries(MEMOS.map(m => [m.file, m.tags || []]));
  setup();
  const params = new URLSearchParams(location.search);
  if (QUIZZES.length) {
    if (params.get('tag')) start({ tag: params.get('tag') });
    else if (params.get('mode') === 'random') start({ tag: null });
  }
})();
</script>
</body>
</html>
