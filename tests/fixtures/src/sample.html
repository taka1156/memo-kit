<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンプルのメモ</title>
<meta name="description" content="テスト用のサンプル。クイズと別メモへのリンクを含む">
<meta name="memo:tags" content="サンプル, テスト">
<meta name="memo:date" content="2026-01-10">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1c2230;
  --fg-2: #5a6376;
  --line: #dde1e8;
  --accent: #0077b6;
  --chip: #eceff4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0e14;
    --surface: #111823;
    --fg: #cdd9e5;
    --fg-2: #7d8b9d;
    --line: #1e2d3d;
    --accent: #00d4ff;
    --chip: #18222f;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans JP', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.7;
  padding: 40px 16px 72px;
}
.wrap { max-width: 880px; margin: 0 auto; }
h1 {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: clamp(1.2rem, 4vw, 1.6rem);
  color: var(--accent);
  letter-spacing: 0.06em;
}
.subtitle { color: var(--fg-2); font-size: 0.85rem; margin: 4px 0 28px; }
h2 {
  font-size: 1.1rem;
  margin: 36px 0 12px;
  padding-left: 10px;
  border-left: 3px solid var(--accent);
}
p { margin: 8px 0; }
code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.85em;
  background: var(--chip);
  padding: 1px 5px;
  border-radius: 4px;
}
pre {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.8rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  overflow-x: auto;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 18px;
}

/* タブ */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tab {
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--fg-2);
  border-radius: 999px;
  padding: 5px 14px;
  font: 600 0.78rem 'JetBrains Mono', ui-monospace, monospace;
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.panel[hidden] { display: none; }

footer#memo-backlink {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  text-align: center;
}
footer#memo-backlink a {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--chip);
  color: var(--fg-2);
  font: 600 12px/1.4 'JetBrains Mono', ui-monospace, monospace;
  letter-spacing: .08em;
  text-decoration: none;
}
footer#memo-backlink a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>サンプルのメモ</h1>
  <p class="subtitle">テストで使うためのページ</p>

  <div class="card summary">
    <strong>ざっくり言うと</strong>
    <ul>
      <li>見出しと図とクイズがある</li>
      <li><a href="sample-plain.html#overview">もう 1 本のメモ</a>へリンクしている</li>
      <li>ざっくり言うとやよくある誤解の見た目は共通の CSS で決まる</li>
    </ul>
  </div>

  <h2 id="intro">はじめに</h2>
  <p>本文の段落。<code>python3 scripts/memo.py build</code> で一覧ができる。</p>
  <svg viewBox="0 0 200 60" role="img" aria-label="図"><rect x="4" y="4" width="80" height="40" fill="none" stroke="currentColor"/><text x="12" y="30">原本</text></svg>

  <h2 id="usage">使い方</h2>
  <ul>
    <li>new で作る</li>
    <li>meta で一覧の情報を付ける</li>
  </ul>

  <footer id="memo-backlink"><a href="index.html">&larr; 一覧に戻る</a></footer>
</div>

<script>
document.querySelectorAll('.tabs').forEach(group => {
  group.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    group.querySelectorAll('.tab').forEach(t => {
      const on = t === tab;
      t.setAttribute('aria-selected', String(on));
      document.getElementById(t.dataset.panel).hidden = !on;
    });
  });
});
</script>

<script type="application/json" id="memo-quiz">
[
  {
    "q": "一覧データを作るコマンドは？",
    "choices": [
      "lint",
      "build",
      "url"
    ],
    "answer": 1,
    "explain": "build が memos.json などを生成する。",
    "ref": "#intro"
  },
  {
    "q": "新しいメモを作るコマンドは？",
    "choices": [
      "new",
      "list",
      "path"
    ],
    "answer": 0,
    "ref": "#usage"
  },
  {
    "q": "一覧の情報を付けるコマンドは？",
    "choices": [
      "preview",
      "add",
      "meta"
    ],
    "answer": 2,
    "ref": "#usage"
  }
]
</script>
</body>
</html>
